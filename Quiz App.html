<!DOCTYPE html>
<html>
<head>
<title>Quiz App</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
}

.container{
    width:500px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

.option{
    display:block;
    margin:10px;
    text-align:left;
}
</style>
</head>
<body>

<div class="container">
    <h1>Quiz App</h1>

    <h3 id="question"></h3>

    <div id="options"></div>

    <button onclick="nextQuestion()">Next</button>

    <h2 id="result"></h2>
</div>

<script>

const quiz = [
{
question:"HTML ka full form kya hai?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Multi Language",
"None"
],
answer:"Hyper Text Markup Language"
},

{
question:"CSS ka use kis liye hota hai?",
options:[
"Programming",
"Styling",
"Database",
"Network"
],
answer:"Styling"
},

{
question:"JavaScript kis liye use hota hai?",
options:[
"Design",
"Database",
"Interactivity",
"Printing"
],
answer:"Interactivity"
}
];

let currentQuestion = 0;
let score = 0;

function loadQuestion(){

document.getElementById("question").innerHTML =
quiz[currentQuestion].question;

let optionsHTML = "";

quiz[currentQuestion].options.forEach(option => {

optionsHTML += `
<label class="option">
<input type="radio" name="answer" value="${option}">
${option}
</label>
`;

});

document.getElementById("options").innerHTML =
optionsHTML;
}

function nextQuestion(){

let selected =
document.querySelector('input[name="answer"]:checked');

if(selected){

if(selected.value === quiz[currentQuestion].answer){
score++;
}

currentQuestion++;

if(currentQuestion < quiz.length){
loadQuestion();
}
else{
document.getElementById("question").innerHTML =
"Quiz Completed";

document.getElementById("options").innerHTML =
"";

document.getElementById("result").innerHTML =
"Your Score: " + score + " / " + quiz.length;
}
}
}

loadQuestion();

</script>

</body>
</html>
